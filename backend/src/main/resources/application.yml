spring:
  application:
    name: skill-radar-backend
  config:
    # backend/.env（已被 .gitignore 忽略）里放 DEEPSEEK_API_KEY=sk-xxx，密钥不进仓库。
    # 文件不存在也能启动（optional），只是简答题 AI 判分会报错提示没配密钥。
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/skill_radar?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 表结构由 database/schema.sql 手工维护，不用 Hibernate 自动生成
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always      # 不然 ResponseStatusException 里写的具体原因（"邮箱已注册"等）不会出现在响应体里
    include-stacktrace: never    # 别把 Java 堆栈跟着错误信息一起发给前端

app:
  deepseek:
    # 简答题 AI 判分用，见 ShortAnswerGradingService。走 DeepSeek 线上 API（OpenAI 兼容格式），
    # 共享主机不再需要独显和本地 Ollama；密钥从环境变量或 backend/.env 读取。
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    api-key: ${DEEPSEEK_API_KEY:}
  cors:
    # 两种访问方式都要放行：
    #  1) http://localhost:[*]  —— 本机开发时直接开 dev server（任意端口：5173 被占用时 Vite 会换端口）
    #  2) https://*.trycloudflare.com —— start-server.ps1 把前端也通过 Cloudflare Tunnel 暴露给队友，
    #     此时浏览器发出的 Origin 是那个随机的 trycloudflare 域名（每次重开隧道会变，所以用通配符）。
    # 这里是「模式」不是「精确 origin」，CorsConfig 用的是 allowedOriginPatterns。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://*.trycloudflare.com}

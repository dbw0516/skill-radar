spring:
  application:
    name: skill-radar-backend
  datasource:
    url: jdbc:mysql://localhost:3306/skill_radar?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 表结构由 database/schema.sql 手工维护，不用 Hibernate 自动生成
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always      # 不然 ResponseStatusException 里写的具体原因（"邮箱已注册"等）不会出现在响应体里
    include-stacktrace: never    # 别把 Java 堆栈跟着错误信息一起发给前端

app:
  ollama:
    # 简答题 AI 判分用，见 ShortAnswerGradingService。需要本机装好 Ollama 并 `ollama pull` 这个模型，
    # 换一台机器当共享主机时也要重新装一遍——本地推理换来的是零成本、不用管密钥。
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:8b}
  cors:
    # 两种访问方式都要放行：
    #  1) http://localhost:5173  —— 本机开发时直接开 dev server
    #  2) https://*.trycloudflare.com —— start-server.ps1 把前端也通过 Cloudflare Tunnel 暴露给队友，
    #     此时浏览器发出的 Origin 是那个随机的 trycloudflare 域名（每次重开隧道会变，所以用通配符）。
    # 这里是「模式」不是「精确 origin」，CorsConfig 用的是 allowedOriginPatterns。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.trycloudflare.com}
